<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academy Gallery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #fff;
      padding: 20px;
      line-height: 1.5;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 1.8rem;
    }
    p.subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }
    .gallery {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      max-width: 800px;
      margin: 0 auto;
    }
    .gallery img {
      width: 100%;
      border-radius: 12px;
      display: block;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    @media (min-width: 600px) {
      .gallery {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <h1>Academy Gallery</h1>
  <p class="subtitle">Welcome to our photo gallery</p>

  <div class="gallery">
    <img src="gallery-1.jpg" alt="Gallery image 1">
    <img src="gallery-2.jpg" alt="Gallery image 2">
    <img src="gallery-3.jpg" alt="Gallery image 3">
    <img src="gallery-4.jpg" alt="Gallery image 4">
    <img src="gallery-5.jpg" alt="Gallery image 5">
  </div>
</body>
</html>
